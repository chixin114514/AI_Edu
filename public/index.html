<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#244e3c">
  <meta name="description" content="慢行，让城市旅行跟随你的节奏。体感自适应旅行智能体原型。">
  <title>慢行 · 跟随你的节奏</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#app">跳转到主要内容</a>
  <aside class="sidebar">
    <a class="brand" href="#plan"><span class="brand-mark" aria-hidden="true">m<span>↗</span></span><span>慢行<small>MANXING</small></span></a>
    <div class="side-caption">每一程，都刚刚好</div>
    <nav aria-label="主导航">
      <button data-page="plan" class="active"><span aria-hidden="true">✦</span>规划旅程</button>
      <button data-page="trip"><span aria-hidden="true">⌁</span>我的行程</button>
      <button data-page="journey"><span aria-hidden="true">♡</span>途中伴行</button>
      <button data-page="report"><span aria-hidden="true">▤</span>旅行手记</button>
      <div class="nav-divider" hidden></div>
      <button data-page="ops" hidden><span aria-hidden="true">⊞</span>运营工作台</button>
    </nav>
    <div class="side-bottom">
      <div class="small-leaf" aria-hidden="true">⌁</div>
      <strong>好风景，不必赶路。</strong><p>感受城市，也照顾自己。</p>
      <button class="text-button" id="privacy-button">隐私与数据说明 ↗</button>
      <div class="version">MVP 0.2 <span>城市动态规划</span></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <a class="brand mobile-brand" href="#plan"><span class="brand-mark" aria-hidden="true">m<span>↗</span></span><span>慢行<small>MANXING</small></span></a>
      <div class="breadcrumb">城市漫游 <span>/</span><strong id="page-name">规划旅程</strong></div>
      <div class="top-meta">
        <span class="mode-pill" id="mode-pill">演示模式</span>
        <button type="button" class="account-button" id="account-button">登录 / 注册</button>
        <details class="more-menu" id="more-menu">
          <summary aria-label="更多选项"><span aria-hidden="true">⋯</span></summary>
          <div class="more-menu-content">
            <button data-page="ops" hidden>运营工作台 ↗</button>
            <button type="button" id="privacy-mobile">隐私与数据说明 ↗</button>
            <button type="button" id="logout-button" hidden>退出登录</button>
          </div>
        </details>
      </div>
    </header>
    <main id="app" tabindex="-1"><div class="loading">正在准备你的慢行空间…</div></main>
    <footer>慢行 MANXING <span>以自己的节奏，遇见一座城。</span><span>城市旅行智能体 · MVP</span></footer>
  </div>
  <nav class="mobile-nav" aria-label="移动导航">
    <button data-page="plan"><span aria-hidden="true" class="nav-icon">✦</span><span>规划</span></button>
    <button data-page="trip"><span aria-hidden="true" class="nav-icon">⌁</span><span>行程</span></button>
    <button data-page="journey"><span aria-hidden="true" class="nav-icon">♡</span><span>伴行</span></button>
    <button data-page="report"><span aria-hidden="true" class="nav-icon">▤</span><span>手记</span></button>
  </nav>
  <dialog id="modal"><button class="modal-close" aria-label="关闭弹窗">×</button><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
